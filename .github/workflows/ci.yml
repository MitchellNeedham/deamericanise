name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # A change that breaks the browser bundle should fail here, not on deploy.
      - run: npm run build:site
      - run: npm run build:extension

      # The package should not be able to fail its own check.
      - run: node dist/cli.js --check src test extension/src extension/static README.md REFERENCE.md
