<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Before and after</title>
  <style>
    body {
      margin: 0;
      width: 1280px;
      height: 800px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      padding: 28px 32px 32px;
      box-sizing: border-box;
      background: #e9efec;
      font-family: "Noto Sans", system-ui, sans-serif;
    }
    figure { margin: 0; display: grid; grid-template-rows: auto 1fr; gap: 12px; }
    figcaption { font-size: 15px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #1d5c4f; }
    iframe { width: 100%; height: 100%; border: 0; border-radius: 12px; background: #fff; box-shadow: 0 8px 28px rgb(0 0 0 / 14%); }
  </style>
</head>
<body>
  <figure><figcaption>As published</figcaption><iframe id="before" src="sample.html"></iframe></figure>
  <figure><figcaption>As you read it</figcaption><iframe id="after"></iframe></figure>
  <script>
    // The extension is off for this page's own host, so the rewritten copy comes from another.
    document.getElementById('after').src = new URLSearchParams(location.search).get('after');
  </script>
</body>
</html>
